[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeed"
version = "1.2.2"
description = "Fast, dependency-light Telegram Bot API framework built on urllib3"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Maxim Zhovner", email = "zovnercukmaksim197@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "bot", "api", "urllib3", "framework", "async-free"]
dependencies = ["urllib3>=2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/fakeskyline/zeed"
Source = "https://github.com/fakeskyline/zeed"
Issues = "https://github.com/fakeskyline/zeed/issues"
Changelog = "https://github.com/fakeskyline/zeed/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
